# Canonical Beacon Labs Nginx virtual host
# Production origin: 159.203.81.39
# Application upstream: 127.0.0.1:3025 (PM2 process: beaconlabs)
#
# Important: retain the named SPA fallback. A direct `try_files ... /index.html`
# fallback created an internal redirect cycle for client routes such as /pricing.

server {
    listen 80;
    listen [::]:80;
    server_name beaconlabs.ai www.beaconlabs.ai beaconlabs.159.203.81.39.nip.io;

    location /api/ {
        proxy_pass http://127.0.0.1:3025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name beaconlabs.ai www.beaconlabs.ai beaconlabs.159.203.81.39.nip.io;

    ssl_certificate /etc/letsencrypt/live/beaconlabs.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beaconlabs.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/beaconlabs-ai/dist/public;
    index index.html;

    location / {
        try_files $uri $uri/ @beaconlabs_spa_entry;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location @beaconlabs_spa_entry {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /report/ {
        try_files /report-template.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/report/ {
        proxy_pass http://127.0.0.1:3099/api/report/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/generate-report-page {
        proxy_pass http://127.0.0.1:3099/api/generate-report-page;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location /reports/ {
        alias /var/www/beaconlabs-ai/dist/public/reports/;
        add_header Content-Disposition "inline";
        add_header Cache-Control "public, max-age=86400";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
